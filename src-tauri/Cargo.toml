[package]
name = "atak-redis-desktop-manager"
version = "0.1.0"
description = "Hızlı, çapraz platform Redis masaüstü yöneticisi"
authors = ["Atak Domain"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "atak_rdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp"] }
# ring: aws-lc-rs Windows'ta cmake/NASM ister — iki platformda da saf derleme için ring
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "async-secret-service", "tokio", "crypto-rust"] }
rusty-leveldb = "4"
flate2 = "1"
brotli = "8"
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
